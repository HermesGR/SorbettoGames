name: Release SorbettoGames 1.0.5 (no core dependencies)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download plugin source from demo
        run: |
          mkdir -p plugin/program.sorbetto.games/resources/art
          mkdir -p plugin/program.sorbetto.games/resources/skins/Default/1080i
          mkdir -p plugin/program.sorbetto.games/resources/skins/Default/media
          BASE=https://raw.githubusercontent.com/HermesGR/demo/main
          curl -fsSL "$BASE/addon.py" -o plugin/program.sorbetto.games/addon.py
          curl -fsSL "$BASE/README-GR.txt" -o plugin/program.sorbetto.games/README-GR.txt
          curl -fsSL "$BASE/catalog.json" -o plugin/program.sorbetto.games/resources/catalog.json
          curl -fsSL "$BASE/settings.xml" -o plugin/program.sorbetto.games/resources/settings.xml
          curl -fsSL "$BASE/SorbettoBrowser.xml" -o plugin/program.sorbetto.games/resources/skins/Default/1080i/SorbettoBrowser.xml
          curl -fsSL "$BASE/SorbettoMenu.xml" -o plugin/program.sorbetto.games/resources/skins/Default/1080i/SorbettoMenu.xml
          curl -fsSL "$BASE/sorbetto-row.png" -o plugin/program.sorbetto.games/resources/skins/Default/media/sorbetto-row.png
          curl -fsSL "$BASE/sorbetto-focus.png" -o plugin/program.sorbetto.games/resources/skins/Default/media/sorbetto-focus.png
          curl -fsSL "$BASE/icon-1.0.4.png" -o plugin/program.sorbetto.games/resources/art/icon-1.0.4.png
          curl -fsSL "$BASE/background-1.0.4.png" -o plugin/program.sorbetto.games/resources/art/background-1.0.4.png

      - name: Write addon.xml without core dependencies
        run: |
          cat > plugin/program.sorbetto.games/addon.xml <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <addon id='plugin.program.sorbetto.games' name='SorbettoGames' version='1.0.5' provider-name='HermesGR'>
            <requires><import addon='xbmc.python' version='3.0.0' /></requires>
            <extension point='xbmc.python.script' library='addon.py' />
            <extension point='xbmc.addon.metadata'>
              <summary lang='en_GB'>RetroPlayer game browser with optional console filter</summary>
              <description lang='en_GB'>All 15 games appear immediately, PlayStation 1 first. Square controller icon and original 16:9 tech background. Prepared for Windows x86_64 / Kodi 21.3; device testing required. No ROMs or BIOS included.</description>
              <platform>all</platform><license>MIT</license>
              <assets><icon>resources/art/icon-1.0.4.png</icon><fanart>resources/art/background-1.0.4.png</fanart></assets>
            </extension>
          </addon>
          XML
          cat plugin/program.sorbetto.games/addon.xml

      - name: Package plugin
        run: |
          cd plugin
          zip -r ../plugin.program.sorbetto.games-1.0.5.zip program.sorbetto.games
          cd ..
          unzip -l plugin.program.sorbetto.games-1.0.5.zip

      - name: Update repository metadata
        run: |
          cat > addons.xml <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <addons>
            <addon id='plugin.program.sorbetto.games' name='SorbettoGames' version='1.0.5' provider-name='HermesGR'>
              <requires><import addon='xbmc.python' version='3.0.0' /></requires>
              <extension point='xbmc.python.script' library='addon.py' />
              <extension point='xbmc.addon.metadata'>
                <summary lang='en_GB'>RetroPlayer game browser with optional console filter</summary>
                <description lang='en_GB'>All 15 games appear immediately, PlayStation 1 first.</description>
                <platform>all</platform><license>MIT</license>
                <assets><icon>resources/art/icon-1.0.4.png</icon><fanart>resources/art/background-1.0.4.png</fanart></assets>
              </extension>
            </addon>
            <addon id='repository.sorbetto.games' name='SorbettoGames Repository' version='1.0.1' provider-name='HermesGR'>
              <extension point='xbmc.addon.repository' name='SorbettoGames Repository'>
                <dir>
                  <info compressed='false'>https://hermesgr.github.io/SorbettoGames/addons.xml</info>
                  <checksum>https://hermesgr.github.io/SorbettoGames/addons.xml.md5</checksum>
                  <datadir zip='true'>https://hermesgr.github.io/SorbettoGames/</datadir>
                </dir>
              </extension>
              <extension point='xbmc.addon.metadata'>
                <summary lang='en_GB'>SorbettoGames add-on repository</summary>
                <description lang='en_GB'>Repository for SorbettoGames Kodi add-ons.</description>
                <platform>all</platform><license>MIT</license>
                <assets><icon>icon.png</icon><fanart>fanart.jpg</fanart></assets>
              </extension>
            </addon>
          </addons>
          XML
          python3 -c "import hashlib;print(hashlib.md5(open('addons.xml','rb').read()).hexdigest())" > addons.xml.md5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: SorbettoGames 1.0.5
          files: plugin.program.sorbetto.games-1.0.5.zip

      - name: Commit repository metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addons.xml addons.xml.md5
          git diff --cached --stat
          git commit -m "Release plugin 1.0.5 without mandatory libretro core dependencies" || true
          git push

      - name: Verify Pages serves new files
        run: |
          sleep 90
          for f in plugin.program.sorbetto.games-1.0.5.zip addons.xml addons.xml.md5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hermesgr.github.io/SorbettoGames/$f")
            echo "$f -> HTTP $code"
          done
