name: Rebuild SorbettoGames Repository (full)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download corrected artwork
        run: |
          curl -fsSL "https://raw.githubusercontent.com/HermesGR/demo/main/icon-1.0.4.png" -o icon.png
          curl -fsSL "https://raw.githubusercontent.com/HermesGR/demo/main/background-1.0.4.png" -o fanart.jpg
          ls -la icon.png fanart.jpg

      - name: Build repository addon from scratch
        run: |
          rm -rf repo_build
          mkdir -p repo_build/repository.sorbetto.games
          cd repo_build/repository.sorbetto.games
          cp ../../icon.png icon.png
          cp ../../fanart.jpg fanart.jpg
          cat > addon.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <addon id="repository.sorbetto.games" name="SorbettoGames Repository" version="1.0.1" provider-name="HermesGR">
            <extension point="xbmc.addon.repository" name="SorbettoGames Repository">
              <dir>
                <info compressed="false">https://hermesgr.github.io/SorbettoGames/addons.xml</info>
                <checksum>https://hermesgr.github.io/SorbettoGames/addons.xml.md5</checksum>
                <datadir zip="true">https://hermesgr.github.io/SorbettoGames/</datadir>
              </dir>
            </extension>
            <extension point="xbmc.addon.metadata">
              <summary lang="en_GB">SorbettoGames add-on repository</summary>
              <description lang="en_GB">Repository for SorbettoGames Kodi add-ons.</description>
              <platform>all</platform>
              <license>MIT</license>
              <assets>
                <icon>icon.png</icon>
                <fanart>fanart.jpg</fanart>
              </assets>
            </extension>
          </addon>
          XML
          cd ..
          zip -r ../repository.sorbetto.games-1.0.1.zip repository.sorbetto.games
          cd ..
          unzip -l repository.sorbetto.games-1.0.1.zip

      - name: Write repository metadata
        run: |
          cat > addons.xml <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <addons>
            <addon id="plugin.program.sorbetto.games" name="SorbettoGames" version="1.0.4" provider-name="HermesGR">
              <requires><import addon="xbmc.python" version="3.0.0" /></requires>
              <extension point="xbmc.python.script" library="addon.py" />
              <extension point="xbmc.addon.metadata">
                <summary lang="en_GB">Browse and launch lightweight retro games.</summary>
                <description lang="en_GB">Browse games from the latest SorbettoGames GitHub Release.</description>
                <platform>all</platform><license>MIT</license>
                <assets><icon>icon.png</icon><fanart>fanart.jpg</fanart></assets>
              </extension>
            </addon>
            <addon id="repository.sorbetto.games" name="SorbettoGames Repository" version="1.0.1" provider-name="HermesGR">
              <extension point="xbmc.addon.repository" name="SorbettoGames Repository">
                <dir>
                  <info compressed="false">https://hermesgr.github.io/SorbettoGames/addons.xml</info>
                  <checksum>https://hermesgr.github.io/SorbettoGames/addons.xml.md5</checksum>
                  <datadir zip="true">https://hermesgr.github.io/SorbettoGames/</datadir>
                </dir>
              </extension>
              <extension point="xbmc.addon.metadata">
                <summary lang="en_GB">SorbettoGames add-on repository</summary>
                <description lang="en_GB">Repository for SorbettoGames Kodi add-ons.</description>
                <platform>all</platform><license>MIT</license>
                <assets><icon>icon.png</icon><fanart>fanart.jpg</fanart></assets>
              </extension>
            </addon>
          </addons>
          XML
          python3 -c "import hashlib;print(hashlib.md5(open('addons.xml','rb').read()).hexdigest())" > addons.xml.md5
          cat addons.xml.md5

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repository.sorbetto.games-1.0.1.zip addons.xml addons.xml.md5
          git diff --cached --stat
          git commit -m "Rebuild repository 1.0.1 with corrected artwork"
          git push

      - name: Verify Pages serves the files
        run: |
          sleep 90
          for f in repository.sorbetto.games-1.0.1.zip plugin.program.sorbetto.games-1.0.4.zip addons.xml addons.xml.md5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hermesgr.github.io/SorbettoGames/$f")
            echo "$f -> HTTP $code"
          done
