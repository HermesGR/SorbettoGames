name: Fix repository layout for Kodi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move add-on packages into Kodi-expected folders
        run: |
          mkdir -p plugin.program.sorbetto.games repository.sorbetto.games
          if [ -f plugin.program.sorbetto.games-1.0.5.zip ]; then
            git mv plugin.program.sorbetto.games-1.0.5.zip plugin.program.sorbetto.games/plugin.program.sorbetto.games-1.0.5.zip
          fi
          if [ -f repository.sorbetto.games-1.0.1.zip ]; then
            git mv repository.sorbetto.games-1.0.1.zip repository.sorbetto.games/repository.sorbetto.games-1.0.1.zip
          fi

      - name: List plugin ZIP contents
        run: unzip -l plugin.program.sorbetto.games/plugin.program.sorbetto.games-1.0.5.zip

      - name: Extract plugin artwork if present
        run: |
          mkdir -p /tmp/plugin_extract plugin.program.sorbetto.games/resources/art
          unzip -o plugin.program.sorbetto.games/plugin.program.sorbetto.games-1.0.5.zip -d /tmp/plugin_extract || true
          find /tmp/plugin_extract -type f \( -name 'icon-1.0.4.png' -o -name 'background-1.0.4.png' \) -print -exec cp -v {} plugin.program.sorbetto.games/resources/art/ \; || true
          ls -la plugin.program.sorbetto.games/resources/art || true

      - name: Update index.html links
        run: |
          sed -i 's#href="plugin.program.sorbetto.games-1.0.5.zip"#href="plugin.program.sorbetto.games/plugin.program.sorbetto.games-1.0.5.zip"#g' index.html
          sed -i 's#href="repository.sorbetto.games-1.0.1.zip"#href="repository.sorbetto.games/repository.sorbetto.games-1.0.1.zip"#g' index.html
          cat index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move add-on packages into Kodi-expected folders and expose artwork" || true
          git push
